name: Modelo predictivo

on:
  workflow_run:
    workflows: ["Análisis de impacto en mercados"]
    types: [completed]
  workflow_dispatch: {}  # también lanzable a mano

jobs:
  modelo-predictivo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Solo se ejecuta si el disparo es manual, o si el análisis de impacto
    # en mercados terminó con éxito (nunca tras un fallo del paso anterior).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-modelado.txt

      - name: Ejecutar el reentrenamiento y la predicción
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: python src/06_modelo_predictivo.py

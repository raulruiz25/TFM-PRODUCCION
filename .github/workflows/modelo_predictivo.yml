name: Modelo predictivo

on:
  schedule:
    # 7:00 UTC — después de la ingesta financiera (6:00) y el análisis de
    # impacto en mercados (6:30), para partir siempre de datos frescos.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  modelo-predictivo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-modelado.txt

      - name: Ejecutar el reentrenamiento y la predicción
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: python src/06_modelo_predictivo.py
